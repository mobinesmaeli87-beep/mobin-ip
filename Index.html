<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تحلیلگر IP – مبین اسماعیلی</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--bg:#9bd5f2;--card:#fff;--tx:#14213d;--mut:#3f4a60;--ac:#1d4ed8;--bd:#dbe1ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}header,footer{text-align:center;padding:24px 16px}header h1{margin:0;font-size:1.6rem}header p,footer{color:var(--mut);margin:0}main{max-width:760px;margin:auto;padding:0 16px;display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}.ip{display:flex;gap:6px;align-items:center;justify-content:center;direction:ltr;margin:6px 0}.ip input{width:22%;max-width:84px;text-align:center;font:600 1.15rem monospace;padding:10px 4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}button{font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;border:0;border-radius:10px;padding:10px 20px;background:var(--ac);color:#fff}.sec{background:none;color:var(--ac);border:1px solid var(--ac)}.row{text-align:center;margin-top:12px}.err{color:#ef4444;text-align:center;min-height:1.5em}table{width:100%;border-collapse:collapse;margin-top:12px}td{padding:9px 10px;border-bottom:1px solid var(--bd)}td:last-child{direction:ltr;text-align:left;font:600 1rem monospace}#out,#src{direction:ltr;text-align:left;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;font:.9rem monospace;white-space:pre-wrap;overflow:auto}#out{margin-top:12px;min-height:60px}.ok{color:#4ade80}.bad{color:#f87171}small{color:var(--mut)}#modal{display:none;position:fixed;inset:0;background:#000a;padding:12px}#modal.on{display:flex}#modal .box{background:var(--card);border-radius:14px;flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px;gap:10px}#src{flex:1;white-space:pre;margin:0}</style></head><body><header><h1>تحلیلگر آدرس IP</h1><p>پروژه‌ی مبین اسماعیلی</p></header><main><section class="card"><h2>۱) تحلیل آدرس IP</h2><div class="ip" id="ipA"></div><div class="err" id="errA"></div><div class="row"><button onclick="analyze()">تحلیل IP</button></div><div id="result"></div></section><section class="card"><h2>۲) پینگ بین دو IP</h2><small>IP اول (مبدأ)</small><div class="ip" id="ip1"></div><small>IP دوم (مقصد)</small><div class="ip" id="ip2"></div><div class="err" id="errP"></div><div class="row"><button onclick="ping()">پینگ</button></div><div id="out">نتیجه‌ی پینگ اینجا نمایش داده می‌شود…</div><small>مرورگر پینگ (ICMP) واقعی ندارد؛ این بخش شبیه‌سازی است و بر اساس هم‌شبکه بودن دو IP جواب می‌دهد.</small></section><div class="row"><button class="sec" onclick="showCode()">مشاهده‌ی کد (ویژه‌ی معلم)</button></div></main><footer>طراحی و ساخت: <b>مبین اسماعیلی</b> (Mobin Esmaeili)</footer><div id="modal"><div class="box"><div><button class="sec" onclick="navigator.clipboard.writeText(src.textContent)">کپی</button><button onclick="modal.classList.remove('on')">بستن</button></div><pre id="src"></pre></div></div><script>const $=id=>document.getElementById(id);
function makeBox(id,vals){let b=$(id);b.innerHTML=vals.map(v=>`<input maxlength="3" inputmode="numeric" value="${v}">`).join("<span>.</span>");let next=e=>e.nextElementSibling?.nextElementSibling;b.oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"");if(e.target.value.length==3)next(e.target)?.focus()};b.onkeydown=e=>{if(e.key=="."){e.preventDefault();next(e.target)?.focus()}}}
makeBox("ipA",[163,31,54,10]);makeBox("ip1",[192,168,1,10]);makeBox("ip2",[192,168,1,20]);
function read(id){let v=[...$(id).querySelectorAll("input")].map(i=>i.value);return v.every(x=>/^\d{1,3}$/.test(x)&&x<=255)?v.map(Number):null}
function calc(ip){let n=ip[0]<128?1:ip[0]<192?2:ip[0]<224?3:0,m=ip.map((_,i)=>i<n?255:0);return{n,mask:m,cls:"ABC"[n-1]||"D/E",net:ip.map((v,i)=>v&m[i]),bc:ip.map((v,i)=>v|(255-m[i]))}}
function analyze(){let ip=read("ipA");$("errA").textContent=ip?"":"هر بایت باید عددی بین 0 تا 255 باشد.";if(!ip)return;let r=calc(ip);if(!r.n){$("result").innerHTML="<p>کلاس D و E شناسه شبکه و میزبان ندارند.</p>";return}let rows=[["آدرس IP",ip.join(".")],["کلاس",r.cls],["شناسه شبکه",ip.slice(0,r.n).join(".")],["شناسه میزبان",ip.slice(r.n).join(".")],["آدرس شبکه",r.net.join(".")],["آدرس Broadcast",r.bc.join(".")],["Subnet mask",r.mask.join(".")],["Subnet value","1".repeat(r.n)]];$("result").innerHTML="<table>"+rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")+"</table>"}
async function ping(){let a=read("ip1"),b=read("ip2");$("errP").textContent=a&&b?"":"هر دو IP باید معتبر باشند (هر بایت 0 تا 255).";if(!a||!b)return;let A=a.join("."),B=b.join("."),x=calc(a),y=calc(b),same=A==B||(x.n&&x.net.join(".")==y.net.join(".")&&B!=y.net.join(".")&&B!=y.bc.join(".")),o=$("out"),ok=0;o.innerHTML=`Pinging ${B} from ${A}:\n`;for(let i=0;i<4;i++){await new Promise(r=>setTimeout(r,600));if(same){ok++;o.innerHTML+=`<span class="ok">Reply from ${B}: time=${Math.floor(Math.random()*8)+1}ms TTL=128</span>\n`}else o.innerHTML+='<span class="bad">Request timed out.</span>\n'}o.innerHTML+=`\nSent = 4, Received = ${ok}, Lost = ${4-ok}\n`+(ok?'<span class="ok">نتیجه: ارتباط برقرار است (هم‌شبکه)</span>':'<span class="bad">نتیجه: ارتباط برقرار نشد (شبکه متفاوت یا آدرس نامعتبر)</span>')}
function showCode(){$("src").textContent="<!DOCTYPE html>\n"+document.documentElement.outerHTML;$("modal").classList.add("on")}</script></body></html>
